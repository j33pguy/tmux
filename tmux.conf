#  ~/.tmux.conf  (installed at ~/.config/tmux/tmux.conf on Omarchy)

# Load Omarchy's base config first, then override everything below.
# Keeps Omarchy's help popup / menu integration; our prefix + bindings win.
if-shell '[ -r /usr/share/omarchy/config/tmux/tmux.conf ]' \
  'source-file /usr/share/omarchy/config/tmux/tmux.conf'

# Tmux Plugin Manager
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'  # recommended basic set

# Your other plugins here (e.g. the which-key one)
set -g @plugin 'alexwforsythe/tmux-which-key'

# === 1. Basics that feel modern ===
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -as terminal-overrides ',*:UTF-8=on'

set -g mouse on                # mouse works (scroll, select pane, resize)
setw -g mode-keys vi           # vi keys in copy mode
set -g history-limit 50000     # bigger scrollback

# Faster command delay (better vim/nvim responsiveness)
set -sg escape-time 10
set -g focus-events on

# Start numbering at 1 (easier to reach with left hand)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on    # keeps numbers consecutive after closing

# === 2. Better prefix (many people prefer Ctrl+a) ===
set -g prefix C-a
unbind C-b
set -gu prefix2                # Omarchy sets prefix2 C-b; unbind alone won't clear it
bind C-a send-prefix

# === 3. Quick splits with current path ===
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'                     # remove old defaults
unbind %

# === 4. Fast pane navigation (vim-style) ===
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# === 5. Resize panes (repeatable with vim keys) ===
bind -r H resize-pane -L 3
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 3

# === 6. Quick reload ===
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux config reloaded"

# === 7. Very simple status bar (optional but clean) ===
set -g status-style "bg=default,fg=default"   # inherit active Omarchy theme
set -g status-left " [#S] "
set -g status-right " %Y-%m-%d %H:%M "
set -g window-status-current-style "bold"
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "

# Initialize TPM (keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
